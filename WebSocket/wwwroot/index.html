<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>WebSocket Chat</title>
    <style>
      body {
        font-family: Arial;
      }
      #messages {
        border: 1px solid #ccc;
        height: 300px;
        overflow-y: auto;
        padding: 8px;
      }
      input {
        width: 80%;
      }
      button {
        width: 18%;
      }
    </style>
  </head>
  <body>
    <h2>WebSocket Chat</h2>

    <div id="messages"></div>
    <br />
    <input id="text" placeholder="Digite uma mensagem..." />
    <button onclick="send()">Enviar</button>

    <script>
      const protocol = location.protocol == "https:" ? "wss" : "ws";
      console.log(location);
      const host = location.host ? location.host : "localhost:5000";
      const url = `${protocol}://${host}/ws`;
      const ws = new WebSocket(url);
      const messages = document.getElementById("messages");
      const clients = [{ id: "12345", cor: "#123456" }];
      const input = document.getElementById("text");

      input.addEventListener("keydown", (e) => {
        if (e.key == "Enter") {
          send();
        }
      });

      addEventListener.event;

      ws.onmessage = (event) => {
        const div = document.createElement("div");
        const divUser = document.createElement("div");

        let dataText = `${event.data}`;
        let id = dataText.substring(0, dataText.indexOf(":"));

        let client = clients.find((client) => client.id == id);

        console.log(client);
        if (!client) {
          client = {
            id,
            cor: gerarCorHex(),
          };

          clients.push(client);
        }

        div.style.display = "flex";

        divUser.style.color = client.cor;
        divUser.style.fontWeight = "bold";
        divUser.textContent = id;

        const divMessage = document.createElement("div");
        divMessage.textContent = dataText.substring(dataText.indexOf(":"));

        div.appendChild(divUser);
        div.appendChild(divMessage);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      };

      function send() {
        const input = document.getElementById("text");
        ws.send(input.value);
        input.value = "";
      }

      function gerarCorHex() {
        // Gera um número aleatório e o converte para hexadecimal
        let cor = "#" + Math.floor(Math.random() * 16777215).toString(16);

        // Garante que a cor tenha sempre 6 dígitos, adicionando zeros à esquerda se necessário
        return cor.padStart(7, "0");
      }
    </script>
  </body>
</html>
